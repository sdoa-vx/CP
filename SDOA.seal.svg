<svg viewBox="0 0 320 320" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Forces the entire browser page canvas to match GitHub dark mode when viewed directly */
      :root { background-color: #0D1117; }

      @keyframes dsCircuitFlow { to { stroke-dashoffset: -1000; } }
      @keyframes dsGlow { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.18); } }
      @keyframes dsRing { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
      .axis-line { stroke: #C9CCD1; stroke-width: 0.75; opacity: 0.22; }
      .glow-element { transform-origin: 180px 180px; animation: dsGlow 3.4s ease-in-out infinite; }
      .ring-element { animation: dsRing 6s ease-in-out infinite; }
      .circuit-line { stroke: #E8B85C; stroke-width: 1.4; opacity: 0.5; }
      .circuit-flow { stroke: #E8B85C; stroke-width: 1.4; stroke-dasharray: 5 13; stroke-linecap: round; animation: dsCircuitFlow 9s linear infinite; }
      .ring-4 { stroke: #D1A45A; stroke-width: 2.4; opacity: 0.92; }
      .crest-line { stroke: #F0C674; stroke-width: 3; stroke-linecap: round; opacity: 0.95; animation: dsRing 6s ease-in-out infinite; }
      .corona-ring { stroke: #E8B85C; stroke-width: 3; stroke-dasharray: 0.5 13.5; stroke-linecap: round; opacity: 0.5; }
      .ticks { stroke: #E8B85C; stroke-width: 1.4; opacity: 0.9; }
      .ring-3 { stroke: #D1A45A; stroke-width: 2; opacity: 0.88; }
      .diamond { stroke: #D1A45A; stroke-width: 1.1; opacity: 0.55; }
      .ring-2 { stroke: #D1A45A; stroke-width: 1.5; opacity: 0.85; }
      .ring-1 { stroke: #E8B85C; stroke-width: 1; opacity: 0.95; }
    </style>
  </defs>

  <g transform="translate(-20, -20)">
  <circle cx="180" cy="180" r="158" fill="#1a1410" />
  <line class="axis-line" x1="180" y1="28" x2="180" y2="332" />
  <line class="axis-line" x1="28" y1="180" x2="332" y2="180" />
  
  <circle class="circuit-line ring-element" cx="180" cy="180" r="156" />
  <circle class="circuit-flow" cx="180" cy="180" r="156" />
  
  <circle class="ring-4" cx="180" cy="180" r="136" />
  
  <path class="crest-line" d="M 62.2 112 A 136 136 0 0 1 297.8 112" />
  <circle class="corona-ring" cx="180" cy="180" r="147" />
  
  <g class="ticks">
    <line x1="180" y1="50" x2="180" y2="38" />
    <line x1="271.9" y1="88.1" x2="280.4" y2="79.6" />
    <line x1="310" y1="180" x2="322" y2="180" />
    <line x1="271.9" y1="271.9" x2="280.4" y2="280.4" />
    <line x1="180" y1="310" x2="180" y2="322" />
    <line x1="88.1" y1="271.9" x2="79.6" y2="280.4" />
    <line x1="50" y1="180" x2="38" y2="180" />
    <line x1="88.1" y1="88.1" x2="79.6" y2="79.6" />
  </g>
  
  <circle class="ring-3" cx="180" cy="180" r="98" />
  <polygon class="diamond" points="180,82 278,180 180,278 82,180" />
  
  <circle class="ring-2" cx="180" cy="180" r="64" />
  <g stroke="#E8B85C" stroke-width="1.6">
    <line x1="180" y1="56" x2="180" y2="72" />
    <line x1="180" y1="288" x2="180" y2="304" />
    <line x1="56" y1="180" x2="72" y2="180" />
    <line x1="288" y1="180" x2="304" y2="180" />
  </g>
  
  <circle class="ring-1" cx="180" cy="180" r="34" />
  
  <circle class="glow-element" cx="180" cy="180" r="11" fill="#E8B85C" opacity="0.4" />
  
  <g class="glow-element">
    <path d="M180 159 L183 180 L180 201 L177 180 Z" fill="#F0C674" />
    <path d="M159 180 L180 177 L201 180 L180 183 Z" fill="#F0C674" />
  </g>
  <circle cx="180" cy="180" r="3.4" fill="#E8B85C" />
  </g>
</svg>
