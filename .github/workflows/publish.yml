name: Publish SDOA MCP Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Extension
        run: npm run release

      - name: Publish to VS Marketplace
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true

      - name: Create Open VSX Namespace
        run: npx ovsx create-namespace sdoa-vx -p "$OVSX_PAT" || true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true

      - name: Publish to Open VSX Registry
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "No .vsix file found — skipping Open VSX publish"
            exit 0
          fi
          npx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true

      - name: Upload VSIX to GitHub Release
        if: github.event_name == 'release'
        run: |
          for vsix in *.vsix; do
            [ -f "$vsix" ] && gh release upload "${{ github.ref_name }}" "$vsix" --clobber || echo "No vsix to upload"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
